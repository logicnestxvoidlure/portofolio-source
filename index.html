
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Website</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
      padding: 40px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    h1 {
      font-size: 42px;
    }

    button {
      padding: 15px 35px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>Welcome to my random website.</p>
    <button onclick="changeText()">Click Me</button>
  </div>

  <script>
    function changeText() {
      document.querySelector("h1").innerText =
        "You clicked the button!";
    }
  </script>
</body>
</html>
